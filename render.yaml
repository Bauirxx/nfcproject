# Blueprint do Render para o backend NestJS (apps/api). CLAUDE.md: backend no Render.
# As chaves do Supabase são definidas no painel do Render (sync: false), nunca no repositório.
services:
  - type: web
    name: nfc-business-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @nfc-business/api build
    startCommand: node apps/api/dist/server.cjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.2
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Session pooler com o papel app_backend (ADR-0013). Segredo: definido só no painel do Render.
      - key: DATABASE_URL
        sync: false
      # Hash dos IPs nas estatísticas (ADR-0014): o Render gera um valor aleatório.
      - key: IP_HASH_SECRET
        generateValue: true
      # O frontend no Vercel reencaminha /api para o Render: dois proxies à frente do backend.
      - key: TRUST_PROXY_HOPS
        value: '2'
      # Origem do frontend (link do cartão no VCF), definida depois de publicar no Vercel.
      - key: PUBLIC_APP_URL
        sync: false
