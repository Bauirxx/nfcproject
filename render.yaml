# Blueprint do Render para o backend NestJS (apps/api). CLAUDE.md: backend no Render.
# As chaves do Supabase são definidas no painel do Render (sync: false), nunca no repositório.
services:
  - type: web
    name: nfc-business-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @nfc-business/api build
    startCommand: node apps/api/dist/server.cjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.2
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
